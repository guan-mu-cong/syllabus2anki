# syllabus2anki configuration template.
# Copy to config.local.yaml (gitignored) and adjust paths for your machine.
# Relative paths are resolved against the directory containing this config file.

extract:
  # Official syllabus PDF containing the word list. User-provided — NOT bundled
  # in this repo for copyright reasons. For CET-4/6 use the《全国大学英语四、六级
  # 考试大纲（2016年修订版）》PDF from the official CET website (see README).
  pdf_path: downloads/syllabus.pdf
  out_path: work/official_words.json

  # Page range of the word-list section, 0-based inclusive (pymupdf indexing).
  # For the CET 2016 syllabus PDF: the list spans pages 20..148 (sample papers
  # start at p149). Find the range for other documents by skimming page numbers.
  page_start: 20
  page_end: 148

  # Pages with fewer plausible entries than this are skipped (filters stray
  # header/TOC pages inside the range).
  min_good_per_page: 3

  # Dictionary probe: directory of cached per-word JSON responses used to
  # verify repair candidates ("is the merged form a real word?"). Generated by
  # 02_fetch_dict.py. If missing/empty, wrapped-entry and space repair are
  # conservatively disabled — run a first pass, fetch the dictionary, then
  # re-run this stage (two-pass bootstrap, see docs/pipeline.md).
  probe_cache_dir: work/yd_cache
  probe_min_file_size: 200

  # One-off headword corrections for PDF artifacts that no general rule can
  # decide safely. Key = extracted headword (lowercase); value = "drop" to
  # remove the entry, or a replacement headword string. Every entry MUST carry
  # a comment explaining the artifact and how it was verified.
  head_fixups:
    # CET 2016 syllabus: the PDF splits "ag(e)ing" (-> ageing) across a line
    # break into "ag(e)" + "ing". "ag" survives extraction as a bogus 2-letter
    # headword — and dictionaries really do have an "ag" entry (silver/Ag),
    # so the probe cannot reject it. "age" and "ing" both exist as genuine
    # separate headwords in the list, so the fragment entry is dropped.
    # Verified against the printed page (2026-11).
    ag: drop

  # Smoke-test words looked up in the output after extraction (searched in
  # headwords AND variants — British spellings like centre/fibre live as
  # variants of center/fiber). zoom covers the single-entry last page.
  # NOTE: "aging" is deliberately absent from this syllabus — the printed
  # "ag(e)ing" wrap artifact resolves to the separate headwords age + ing.
  self_check_words:
    - centre
    - adviser
    - colonise
    - fibre
    - practice
    - marvelous
    - amongst
    - mold
    - axis
    - logistics
    - "o'clock"
    - cliché
    - "according to"
    - "owing to"
    - coup
    - zoom

build:
  # Data directory holding the pipeline working files (entries json from
  # stage 01, dictionary cache from stage 02, corpus/frequency/audio/
  # translation caches from stages 02-04). Standard filenames expected:
  #   entries_7619.json  plan.json  corpus.json  hbs_index.json
  #   engra_index.json  audio_map.json  audio_map2.json  translations.json
  #   ai_mnemonic.json  yd_cache/
  # (all optional except entries — missing aux files load as empty)
  # NOT bundled in this repo (dictionary-derived data); see docs/compliance.md.
  data_dir: work
  entries: entries_7619.json    # file name inside data_dir; "entries"/"words"/list all accepted
  out_path: work/cards_built.json

fetch:
  data_dir: work
  entries: entries_7619.json
  cache_dir: yd_cache
  provider: youdao              # example provider; add yours in PROVIDERS
  workers: 6
  delay_s: 0.3                  # politeness delay per worker
  timeout: 25

audio:
  data_dir: work
  entries: entries_7619.json
  map_out: work/audio_map2.json # word -> {uk,us} mp3 filename map (stage 05 input)

translate:
  data_dir: work
  entries: entries_7619.json
  cache: translations.json      # inside data_dir; key = cleaned English sentence
  api_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  model: qwen-flash             # any OpenAI-compatible chat model
  api_key_env: S2A_TRANSLATE_API_KEY   # env var NAME holding the key (never in config)
  temperature: 0.2
  workers: 16

attribute:
  data_dir: work
  cards: work/cards_built.json  # stage 05 output
  audit_out: work/attributor_audit.jsonl
  llm:
    enabled: false              # false = deterministic rules-only (fully offline)
    api_key_env: S2A_LLM_API_KEY
    api_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    models: [qwen3.8-flash, qwen-flash, qwen-turbo, qwen-plus]

finalize:
  data_dir: work
  cards: work/cards_built.json
  audit: work/attributor_audit.jsonl
  out_path: work/cards_final.json

anki:
  host: 127.0.0.1
  port: 27701
  api_key_file: null            # ABSOLUTE path to AnkiConnect key file, outside the repo
  api_key_env: S2A_ANKI_KEY     # fallback: env var NAME
  model: MyVocab v1
  deck: MyVocabDeck
  template_name: Card 1
  batch: 300
  cards: work/cards_final.json  # stage 05c output
  fields_from: null             # or the record key holding the final field dict
  word_field: 单词
  fields: [单词, 音节, 音标美, 音标英, 发音美, 发音英, 考频, 常用义项, 英英释义,
           真题例句, 高质量例句, 词根, 词源, 助记, 辨析, 柯林斯, 搭配, 同根词,
           全义项, 柯林斯星级]
  tags: [vocabulary]
  star_tag: {field: 官方★, tag: starred}
  allow_duplicate: false
  written_log: work/written.json
  template:
    front: assets/templates/v5_front.html
    back: assets/templates/v5_back.html
    css: assets/templates/v5_css.css
  media:
    dir: work/audio32
    done_log: work/media_done.json
    workers: 6

audit:
  data_dir: work                # for the optional G4 semantic gate (hbs COCA index)
  cards: work/cards_final.json
  media_dir: null               # ABSOLUTE path to Anki collection.media (anki mode)
