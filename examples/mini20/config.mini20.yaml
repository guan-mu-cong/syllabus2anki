# mini20 demo config — fully synthetic data, zero network, zero Anki needed.
# Paths are relative to THIS file (examples/mini20/).

extract:
  # stage 01 not part of the demo: entries are pre-generated by gen_data.py
  pdf_path: null
  wordlist: data/entries_7619.json

build:
  data_dir: data
  entries: entries_7619.json
  out_path: out/cards_mini.json

fetch:
  data_dir: data
  entries: entries_7619.json
  cache_dir: yd_cache

audio:
  data_dir: data
  entries: entries_7619.json
  map_out: data/audio_map2.json

translate:
  data_dir: data
  entries: entries_7619.json
  cache: translations.json

attribute:
  data_dir: data
  cards: out/cards_mini.json
  audit_out: out/audit_mini.jsonl
  llm:
    enabled: false

finalize:
  data_dir: data
  cards: out/cards_mini.json
  audit: out/audit_mini.jsonl
  out_path: out/cards_final_mini.json

anki:
  host: 127.0.0.1
  port: 27701
  model: Mini20 Demo
  deck: Mini20 Demo Deck
  cards: out/cards_final_mini.json
  word_field: 单词
  fields: [单词, 音节, 音标美, 音标英, 发音美, 发音英, 考频, 常用义项, 英英释义,
           真题例句, 高质量例句, 词根, 词源, 助记, 辨析, 柯林斯, 搭配, 同根词,
           全义项, 柯林斯星级]
  written_log: out/written.json
  template:
    front: ../../assets/templates/v5_front.html
    back: ../../assets/templates/v5_back.html
    css: ../../assets/templates/v5_css.css

audit:
  data_dir: data
  cards: out/cards_final_mini.json
